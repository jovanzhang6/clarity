<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
  <title>Clarity</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="mini">
  <div class="mini-dot" id="dot"></div>
  <div class="mini-time" id="time">00:00</div>
  <button class="mini-icon" id="b-sys" aria-pressed="true" title="系统声音：录制中，点击关闭">
    <svg class="ic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
      <path d="M18.8 5.2a9.2 9.2 0 0 1 0 13.6"></path>
    </svg>
    <svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
  </button>
  <button class="mini-icon" id="b-mic" aria-pressed="false" title="麦克风：录制中，点击关闭">
    <svg class="ic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
      <line x1="12" y1="19" x2="12" y2="23"></line>
    </svg>
    <svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
      <line x1="12" y1="19" x2="12" y2="23"></line>
      <line class="mute-line" x1="2" y1="2" x2="22" y2="22"></line>
    </svg>
  </button>
  <button class="mini-icon" id="b-pause" title="暂停/继续">
    <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor" stroke="none">
      <rect x="6" y="4" width="4.5" height="16" rx="1.5"></rect>
      <rect x="13.5" y="4" width="4.5" height="16" rx="1.5"></rect>
    </svg>
    <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="display:none">
      <path d="M7 4.5v15l13-7.5z"></path>
    </svg>
  </button>
  <button class="mini-icon stop" id="b-stop" title="停止并保存">
    <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
      <rect x="5.5" y="5.5" width="13" height="13" rx="2.5"></rect>
    </svg>
  </button>
  <button class="mini-icon" id="b-min" title="最小化（Alt+Shift+C 呼出）">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
  </button>
  <button class="mini-icon" id="b-expand" title="还原主窗口">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 3 21 3 21 9"></polyline>
      <polyline points="9 21 3 21 3 15"></polyline>
      <line x1="21" y1="3" x2="14" y2="10"></line>
      <line x1="3" y1="21" x2="10" y2="14"></line>
    </svg>
  </button>
  <script src="mini.js"></script>
</body>
</html>
